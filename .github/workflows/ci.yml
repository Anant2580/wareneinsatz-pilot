# Runs on every push and pull request: lint and format check, then all tests against a real
# PostgreSQL 16, including the migrations (up, models-vs-migrations check, down).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wareneinsatz
          POSTGRES_PASSWORD: wareneinsatz
          POSTGRES_DB: wareneinsatz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wareneinsatz -d wareneinsatz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://wareneinsatz:wareneinsatz@localhost:5432/wareneinsatz_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Python 3.12 and the exact versions from uv.lock
        run: uv sync --locked

      - name: Install Tesseract OCR with German (step 5 OCR tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test (schema, repository, migrations, OCR; the language model is replaced by a fake)
        run: uv run pytest -v
