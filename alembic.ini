# Alembic configuration. The database URL is not stored here: migrations/env.py reads
# DATABASE_URL from the environment or .env (see src/wareneinsatz/config.py).
#
#   uv run alembic upgrade head                      apply all migrations
#   uv run alembic revision --autogenerate -m "..."  create a migration from changes in models.py
#   uv run alembic check                             fail if models.py and the migrations differ

[alembic]
script_location = %(here)s/migrations
# Readable file names: 0001_invoice_core_tables.py (pass --rev-id 0002 etc. for new revisions)
file_template = %%(rev)s_%%(slug)s
# Import the code straight from src/ (relative to where alembic is run: the project folder)
prepend_sys_path = src
path_separator = os

[post_write_hooks]
# New migration files are linted and formatted automatically, like the rest of the code.
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
